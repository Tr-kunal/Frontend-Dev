<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Schedule</title>
</head>
<body>
    <h1>Tech Conference Schedule</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">Morning</td>
                <td>9:00 AM</td>
                <td>Opening Keynote</td>
                <td>Dr.A</td>
            </tr>
            <tr>
                <td>10:00 AM</td>
                <td>AI Trends</td>
                <td>Prof. B</td>
            </tr>
            <tr>
                <td>11:00 AM</td>
                <td>Web Development</td>
                <td>Ms. C</td>
            </tr>
            <tr>
                <td rowspan="2">Afternoon</td>
                <td>1:00 PM</td>
                <td>Data Science</td>
                <td>Mr. D</td>
            </tr>
            <tr>
                <td>2:00 PM</td>
                <td>Cybersecurity</td>
                <td>Dr. E</td>
            </tr>
            <tr>
                <td rowspan="1">Evening</td>
                <td>5:00 PM</td>
                <td>Closing Remarks</td>
                <td>Dr. F</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Conference ends at 6:00 PM</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
